<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECHO-SIREN 首页预览</title>
<style>
  :root {
    --bezel: #0B0E10;
    --ink: #1A1A1A;
    --darkline: rgba(11, 25, 30, .82);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #101417; min-height: 100vh; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #e8eef2;
    display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; overflow: hidden; height: 100vh; width: 100vw;
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #8b969d; margin-bottom: 18px; }
  .sub b { color: #67e0d2; }

  #stage {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100vh;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tag { font-size: 12px; color: #9aa6ad; letter-spacing: 2px; }
  .tag.hot { color: #67e0d2; font-weight: 700; }

  .phone {
    width: 450px; height: 975px;
    background: transparent;
    border-radius: 0;
    padding: 0;
    transform-origin: center center;
    box-shadow: none;
  }
  .screen {
    position: relative;
    width: 450px; height: 975px;
    border-radius: 0;
    overflow: hidden;
    background: #7FE6D2;
    isolation: isolate;
  }

  /* ---------- 背景 ---------- */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg,
      #A9F2E1 0%, #7FE6D2 9%, #5CC9BE 24%, #3FAEAB 44%,
      #1E6E7C 68%, #144D5A 84%, #0E3240 100%);
  }
  .beam {
    position: absolute; z-index: 1; left: -20%; top: -14%; width: 96%; height: 92%;
    background: linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.14) 24%, rgba(255,255,255,0) 56%);
    pointer-events: none;
  }
  .noise {
    position: absolute; inset: 0; z-index: 2; opacity: .05; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/></svg>");
  }
  .bigword {
    position: absolute; z-index: 1; left: 8px; top: 14px;
    font-family: "Arial Black", "Microsoft YaHei", sans-serif;
    font-weight: 900; line-height: .92;
    color: rgba(255,255,255,.34);
    letter-spacing: 2px;
    transform: rotate(-2deg);
    pointer-events: none;
    text-align: left;
  }
  .bigword .echo { display: block; font-size: 34px; letter-spacing: 12px; margin-left: 4px; }
  .bigword .siren { display: block; font-size: 116px; letter-spacing: 0; }
  .speedline {
    position: absolute; z-index: 1; width: 2px; height: 90px;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0));
    transform: rotate(-18deg); pointer-events: none;
  }
  .city { position: absolute; z-index: 1; left: 0; width: 100%; pointer-events: none; }
  .city.far  { bottom: 34px; height: 380px; opacity: .55; }
  .city.near { bottom: -6px; height: 300px; opacity: .95; }
  .lightray {
    position: absolute; z-index: 1; bottom: 0; width: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.0), rgba(255,255,255,.16));
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    pointer-events: none;
  }

  /* ---------- 通用工艺：黑外轮廓 + 白内边 + 左上高光 + 右下硬投影 ---------- */
  .craft {
    box-shadow:
      0 0 0 3px var(--darkline),
      0 7px 0 rgba(15, 45, 55, .35);
  }
  .glint {
    position: absolute; top: 5%; left: 9%; width: 34%; height: 16%;
    background: linear-gradient(120deg, rgba(255,255,255,.85), rgba(255,255,255,0));
    border-radius: 50%;
    filter: blur(1px);
    pointer-events: none;
  }

  /* ---------- 顶部信息 ---------- */
  .top-ui { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .avatar-card {
    position: absolute; left: 14px; top: 16px; width: 58px; height: 58px;
    background: #cdbcf2; border: 3px solid #fff; border-radius: 14px;
    transform: rotate(-4deg);
    box-shadow:
      0 0 0 3px var(--darkline),
      0 4px 0 rgba(23,80,94,.30),
      inset 3px 3px 0 rgba(255,255,255,.35);
    overflow: hidden;
  }
  .avatar-card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 4%; }
  .avatar-badge {
    position: absolute; right: -7px; top: -7px; width: 21px; height: 21px;
    background: #E64545; border: 2px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 2px var(--darkline), 0 2px 0 rgba(23,80,94,.30);
    color: #fff; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .player-name {
    position: absolute; left: 86px; top: 15px;
    font-size: 18px; font-weight: 800; color: #F4FFFF;
    text-shadow: 0 1px 0 rgba(23,48,58,.55);
  }
  .player-sub { position: absolute; left: 86px; top: 40px; display: flex; align-items: center; gap: 5px; }
  .hex-badge {
    width: 16px; height: 16px; background: #8a7cff;
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 8px; font-weight: 900;
    filter: drop-shadow(0 1px 0 rgba(23,48,58,.4));
  }
  .player-gems { font-size: 14px; font-weight: 900; color: #17303A; }
  .gem-mini { width: 15px; height: 13px; display: inline-block; }

  .skip {
    position: absolute; right: 5px; top: 26px;
    writing-mode: vertical-rl; font-size: 12px; letter-spacing: 5px;
    color: rgba(255,255,255,.8); text-shadow: 0 1px 0 rgba(23,48,58,.4);
  }
  .rbtn {
    position: absolute; right: 14px; width: 31px; height: 31px; border-radius: 50%;
    background: linear-gradient(160deg, rgba(52,72,82,.85), rgba(20,40,48,.85));
    border: 2px solid rgba(255,255,255,.55);
    box-shadow:
      0 0 0 2.5px var(--darkline),
      0 3px 0 rgba(15,45,55,.35),
      inset -2px -2px 0 rgba(0,0,0,.25),
      inset 2px 2px 0 rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
  }
  .rbtn.bell { top: 72px; }
  .rbtn.user { top: 112px; }
  .rbtn svg { width: 17px; height: 17px; }

  /* 左缘小活动入口：挂签质感 */
  .side-badge {
    position: absolute; left: 7px; width: 29px; height: 29px; border-radius: 8px;
    background: linear-gradient(160deg, rgba(40,66,76,.92), rgba(20,40,48,.92));
    border: 2px solid rgba(255,255,255,.5);
    box-shadow:
      0 0 0 2px var(--darkline),
      0 3px 0 rgba(15,45,55,.35),
      inset 2px 2px 0 rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
  }
  .side-badge svg { width: 17px; height: 17px; }
  .side-badge::after {
    content: ""; position: absolute; right: -3px; top: -3px; width: 9px; height: 9px;
    background: #E64545; border: 1.5px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--darkline);
  }
  .sb1 { top: 208px; } .sb2 { top: 245px; } .sb3 { top: 282px; }

  /* ---------- 角色贴纸 ---------- */
  .hero {
    position: absolute; z-index: 4; left: 30px; top: 138px; width: 388px; height: 690px;
    object-fit: contain;
    filter: drop-shadow(0 8px 0 rgba(15,45,55,.22)) drop-shadow(0 0 6px rgba(90,230,255,.35));
    pointer-events: none;
  }
  .spark { position: absolute; z-index: 5; pointer-events: none; }
  .spark.big { right: 66px; top: 92px; width: 54px; height: 54px; }
  .spark.small { right: 170px; top: 164px; width: 26px; height: 26px; opacity: .9; }
  .spark svg { width: 100%; height: 100%; filter: drop-shadow(0 0 6px rgba(239,255,251,.9)); }

  /* ---------- 右侧贴纸入口卡 ---------- */
  .note {
    position: absolute; z-index: 6; background: #fff;
    border-radius: 8px; padding: 14px 15px;
    box-shadow:
      0 0 0 2px var(--darkline),
      5px 6px 0 rgba(20,50,60,.25);
    color: var(--ink);
  }
  .note::after {
    content: ""; position: absolute; right: -2px; bottom: -2px; width: 0; height: 0;
    border-style: solid;
    border-width: 0 0 20px 20px;
    border-color: transparent transparent #c3d0d2 transparent;
    filter: drop-shadow(-1px -1px 0 rgba(20,50,60,.18));
  }
  .note .tape {
    position: absolute; left: 50%; top: -8px; transform: translateX(-50%) rotate(-3deg);
    width: 40px; height: 14px;
    background: rgba(184, 231, 228, .78);
    border: 1px solid rgba(23,48,58,.14);
    box-shadow: 0 1px 0 rgba(23,48,58,.08);
  }
  .note h3 { font-size: 23px; font-weight: 900; line-height: 1.05; color: #1A1A1A; position: relative; z-index: 2; }
  .note small { font-size: 12px; color: #555; font-weight: 600; position: relative; z-index: 2; }
  .note1 { right: 14px; top: 540px; width: 134px; transform: rotate(3.5deg); }
  .note1 .gem-big {
    position: absolute; right: 15px; bottom: 15px; width: 26px; height: 26px;
  }
  .note2 { right: 8px; top: 672px; width: 178px; transform: rotate(2deg); }
  .note2 .note2-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 2; }
  .note2 .note2-txt { display: flex; flex-direction: column; min-width: 0; }
  .note2 .thumb {
    position: relative; flex-shrink: 0; width: 48px; height: 48px; border-radius: 11px;
    background: linear-gradient(160deg, #8fe6d8 0%, #35a8a3 55%, #1e6e7c 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), 0 0 0 2px var(--darkline), 0 3px 0 rgba(20,50,60,.25);
    overflow: hidden;
  }
  .note2 .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
  .note2 .thumb::after {
    content: ""; position: absolute; right: 6px; top: 6px; width: 10px; height: 10px;
    background: #fff9c8; border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(23,48,58,.5), 0 0 8px 3px rgba(255,249,200,.55);
  }
  .note2 .progress { position: relative; margin-top: 10px; z-index: 2; font-size: 15px; font-weight: 900; color: #1A1A1A; }
  .note2 .progress span { font-size: 10px; color: #777; font-weight: 600; }

  /* ---------- 底部导航 ---------- */
  .bottom-fade {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 230px;
    background: linear-gradient(180deg, rgba(10,30,38,0) 0%, rgba(10,30,38,.42) 100%);
    pointer-events: none;
  }
  .dock {
    position: absolute; z-index: 7; left: 12px; right: 12px; bottom: 16px; height: 196px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .nav {
    position: relative; cursor: pointer; transition: transform .15s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .nav:hover { transform: translateY(-3px); }
  .nav:active { transform: translateY(1px) scale(.98); }

  /* 1 商城：红色售货机 */
  .shop {
    width: 74px; height: 150px;
    background:
      linear-gradient(115deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 34%),
      linear-gradient(180deg, #E64545 0%, #C73333 100%);
    border: 3px solid #fff; border-radius: 12px;
    box-shadow:
      0 0 0 3px var(--darkline),
      0 7px 0 rgba(15,45,55,.35),
      inset 0 -8px 0 rgba(0,0,0,.14);
  }
  .shop .awning {
    position: absolute; left: -5px; right: -5px; top: -16px; height: 27px;
    border: 3px solid #fff; border-radius: 12px;
    background: repeating-linear-gradient(90deg, #E64545 0 9px, #ffffff 9px 18px);
    box-shadow: 0 0 0 3px var(--darkline), 0 4px 0 rgba(15,45,55,.28);
  }
  .shop .awning::after { /* 波浪檐 */
    content: ""; position: absolute; left: -3px; right: -3px; bottom: -8px; height: 8px;
    background:
      radial-gradient(circle at 7px 0, #E64545 0 6px, #fff 6.5px 7px, transparent 7.5px) 0 0 / 14px 8px repeat-x;
  }
  .shop .hot {
    position: absolute; top: -6px; right: -15px;
    background: #F6D833; border: 2px solid #fff; border-radius: 5px;
    box-shadow: 0 0 0 2px var(--darkline), 0 2px 0 rgba(15,45,55,.28);
    color: #C73333; font-size: 10px; font-weight: 900;
    padding: 1px 5px; transform: rotate(8deg);
    z-index: 3;
  }
  .shop .win {
    position: absolute; left: 15%; top: 38px; width: 70%; height: 44px;
    background: rgba(20,40,48,.9);
    border: 2px solid #fff;
    border-radius: 6px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.5), 0 0 0 1.5px var(--darkline);
  }
  .shop .win i {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.9);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.25), inset 2px 2px 0 rgba(255,255,255,.5);
  }
  .shop .win i:nth-child(1) { left: 8px;  top: 8px;  background: #ffd23e; }
  .shop .win i:nth-child(2) { left: 26px; top: 8px;  background: #4fd8e8; }
  .shop .win i:nth-child(3) { left: 44px; top: 8px;  background: #ff8fc0; }
  .shop .win i:nth-child(4) { left: 8px;  top: 26px; background: #9b8cff; }
  .shop .win i:nth-child(5) { left: 26px; top: 26px; background: #7ce38b; }
  .shop .win i:nth-child(6) { left: 44px; top: 26px; background: #ffd23e; }
  .shop .slot {
    position: absolute; left: 50%; top: 94px; transform: translateX(-50%);
    width: 26px; height: 5px; border-radius: 3px;
    background: rgba(20,40,48,.9);
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 1.5px var(--darkline);
  }
  .shop .label {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    background: #fff; border-radius: 6px; padding: 3px 10px;
    box-shadow: 0 0 0 2px var(--darkline), 0 3px 0 rgba(15,45,55,.28);
    text-align: center; white-space: nowrap;
  }
  .shop .label b { display: block; font-size: 12px; color: #1A1A1A; line-height: 1.1; letter-spacing: 2px; }
  .shop .label span { font-size: 8px; color: #8A8A8A; letter-spacing: 1px; }

  /* 2 现场LIVE：粉色主推大气泡（选中态+星芒） */
  .live {
    width: 108px; height: 186px; margin-bottom: -14px;
    background:
      radial-gradient(circle at 50% 24%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 30%),
      radial-gradient(circle at 50% 26%, #FFC2DA 0%, #FF5FA2 48%, #F23D7F 100%);
    border: 3.5px solid #fff;
    border-radius: 50% 50% 48% 52% / 42% 42% 58% 58%;
    box-shadow:
      0 0 0 3px var(--darkline),
      0 0 24px rgba(255,95,162,.55),
      0 7px 0 rgba(15,45,55,.28);
  }
  .live::before {
    content: ""; position: absolute; left: 22%; right: 22%; top: 6%; height: 15%;
    background: rgba(255,255,255,.65); border-radius: 50%;
    filter: blur(3px);
  }
  .live::after {
    content: ""; position: absolute; inset: 7px;
    border: 2px dashed rgba(255,255,255,.35);
    border-radius: 50% 50% 48% 52% / 42% 42% 58% 58%;
  }
  .live .starburst {
    position: absolute; right: 6px; top: 16px; width: 34px; height: 34px;
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .live .note-ico { position: relative; width: 42px; height: 42px; margin-bottom: 2px; }
  .live .note-ico svg { width: 42px; height: 42px; }
  .live .cn { font-size: 20px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: 3px; text-shadow: 0 2px 0 rgba(140,15,60,.35); }
  .live .en { font-size: 10px; font-weight: 800; color: rgba(255,255,255,.92); letter-spacing: 2px; margin-bottom: 12px; }

  /* 3/4 档案/图鉴：彩色六边形入口 */
  .hex-nav { width: 66px; height: 96px; }
  .hex-nav .hex-outer, .hex-nav .hex-inner {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  }
  .hex-nav .hex-outer { width: 62px; height: 72px; background: #fff; box-shadow: 0 0 0 3px var(--darkline), 0 5px 0 rgba(15,45,55,.32); }
  .hex-nav .hex-inner {
    width: 53px; height: 62px; top: 4px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .hex-nav .hex-inner .glint { top: 2%; left: 12%; width: 46%; height: 18%; }
  .hex-nav .hex-inner svg { width: 24px; height: 24px; margin-top: 3px; }
  .hex-nav .cn { margin-top: 83px; font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 2px; text-shadow: 0 1px 0 rgba(15,45,55,.5); }
  .hex-nav .en { font-size: 8px; font-weight: 700; color: rgba(255,255,255,.78); letter-spacing: 1px; }
  .hex-nav.roster .hex-inner { background: linear-gradient(180deg, #3FC6F0, #1E9BD8); }
  .hex-nav.codex  .hex-inner { background: linear-gradient(180deg, #FFC34D, #F09A20); }

  /* 5 招募：紫色水晶 */
  .summon { width: 82px; height: 152px; }
  .summon .cry-outer, .summon .cry-inner {
    position: absolute; left: 50%; transform: translateX(-50%);
    clip-path: polygon(50% 0, 100% 15%, 90% 100%, 10% 100%, 0 15%);
  }
  .summon .cry-outer {
    width: 74px; height: 150px; background: #fff;
    box-shadow: 0 0 0 3px var(--darkline), 0 0 20px rgba(110,93,246,.5), 0 7px 0 rgba(15,45,55,.3);
  }
  .summon .cry-inner {
    width: 65px; height: 141px; top: 4px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 26%),
      linear-gradient(135deg, #9C8FFF 0%, #6E5DF6 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    overflow: hidden;
  }
  .summon .cry-inner::before {
    content: ""; position: absolute; left: 4px; top: 8px; bottom: 12px; width: 3px;
    background: linear-gradient(180deg, #58E6E8, rgba(88,230,232,.2));
    box-shadow: 0 0 8px rgba(88,230,232,.8);
  }
  .summon .cry-inner::after {
    content: ""; position: absolute; right: -18px; top: 22px; width: 60px; height: 2px;
    background: rgba(255,255,255,.4); transform: rotate(-58deg);
    box-shadow: 0 18px 0 rgba(255,255,255,.18), 0 36px 0 rgba(255,255,255,.12);
  }
  .summon .star { position: absolute; right: 14px; top: 10px; width: 16px; height: 16px; }
  .summon .star svg { width: 100%; height: 100%; filter: drop-shadow(0 0 5px #fff); }
  .summon .cn { font-size: 16px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: 3px; }
  .summon .en { font-size: 8px; font-weight: 700; color: rgba(255,255,255,.82); letter-spacing: 1px; margin-bottom: 16px; }

  .version {
    position: absolute; z-index: 8; left: 16px; bottom: 8px;
    font-size: 9px; color: rgba(255,255,255,.55); letter-spacing: .5px;
  }

  .ref-img { width: 100%; height: 100%; object-fit: fill; border-radius: 28px; display: block; }
</style>
</head>
<body>
  <div id="stage">
    <div class="wrap">
      <div class="phone">
        <div class="screen">
          <div class="bg"></div>
          <div class="beam"></div>

          <svg class="city far" viewBox="0 0 450 300" preserveAspectRatio="none">
            <g fill="#2E8B93">
              <rect x="0" y="150" width="52" height="150"/>
              <rect x="40" y="96" width="46" height="204"/>
              <rect x="104" y="180" width="58" height="120"/>
              <rect x="150" y="64" width="40" height="236"/>
              <rect x="210" y="150" width="64" height="150"/>
              <rect x="258" y="110" width="42" height="190"/>
              <rect x="318" y="170" width="58" height="130"/>
              <rect x="364" y="92" width="42" height="208"/>
              <rect x="418" y="150" width="40" height="150"/>
              <rect x="150" y="40" width="4" height="40"/>
              <rect x="364" y="66" width="4" height="40"/>
            </g>
          </svg>
          <svg class="city near" viewBox="0 0 450 300" preserveAspectRatio="none">
            <g fill="#17505E">
              <rect x="0" y="120" width="66" height="180"/>
              <rect x="52" y="60" width="52" height="240"/>
              <rect x="120" y="150" width="70" height="150"/>
              <rect x="176" y="30" width="46" height="270"/>
              <rect x="244" y="120" width="76" height="180"/>
              <rect x="300" y="76" width="48" height="224"/>
              <rect x="366" y="140" width="70" height="160"/>
              <rect x="430" y="100" width="24" height="200"/>
              <rect x="52" y="34" width="5" height="40"/>
              <rect x="176" y="8" width="5" height="40"/>
              <rect x="300" y="50" width="5" height="40"/>

    var s = Math.min(window.innerWidth / bw, window.innerHeight / bh);

    phones.forEach(function (el) { el.style.transform = 'scale(' + s + ')'; });
    var stage = document.getElementById('stage');
    stage.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
